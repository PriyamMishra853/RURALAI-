# One container runs both halves of the backend: the Express API and the Python
# inference service it calls on loopback. Python is therefore part of the
# runtime image, not just a build tool.
[phases.setup]
nixPkgs = ['nodejs_20', 'python311']

# NumPy, SciPy and scikit-learn ship manylinux wheels containing compiled
# extensions that link against the system C++ runtime. A Nix-provided Python
# does not put that runtime on the loader path, so the wheels install perfectly
# and then fail at import with:
#
#   libstdc++.so.6: cannot open shared object file: No such file or directory
#
# which reads as a broken NumPy rather than a missing library. nixLibs adds
# these to LD_LIBRARY_PATH for the built image. zlib is included for the same
# class of reason — SciPy links it.
nixLibs = ['stdenv.cc.cc.lib', 'zlib']

[phases.install]
cmds = [
  'cd backend && npm install',
  'cd frontend && npm install',
  # Non-fatal by design — see build-ai.sh. A dependency that will not resolve
  # costs symptom retrieval, not the whole deploy.
  'bash ./build-ai.sh'
]

[phases.build]
cmds = ['cd frontend && npm run build']

[start]
cmd = './start.sh'
