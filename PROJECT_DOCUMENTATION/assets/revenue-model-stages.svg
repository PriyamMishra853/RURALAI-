<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"><rect width="1280" height="720" fill="#fcfcfb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#898781"/></marker><clipPath id="c0"><path d="M64,388 Q64,380 72,380 H424 Q432,380 432,388 V610 H64 Z"/></clipPath><clipPath id="c1"><path d="M456,288 Q456,280 464,280 H816 Q824,280 824,288 V610 H456 Z"/></clipPath><clipPath id="c2"><path d="M848,188 Q848,180 856,180 H1208 Q1216,180 1216,188 V610 H848 Z"/></clipPath></defs><text x="64" y="76" font-size="30" font-weight="600" fill="#0b0b0b">Revenue model: three stages, each unlocking the next</text><text x="64" y="108" font-size="16" fill="#52514e">RuralAI Virtual Village Clinic · public healthcare first, commercial revenue funds the platform</text><g clip-path="url(#c0)"><path d="M64,388 Q64,380 72,380 H424 Q432,380 432,388 V610 H64 Z" fill="#2a78d6" fill-opacity="0.10"/><rect x="64" y="380" width="368" height="5" fill="#2a78d6"/></g><circle cx="97" cy="419" r="5" fill="#2a78d6"/><text x="110" y="424" font-size="12.5" font-weight="600" letter-spacing="1" fill="#52514e">STAGE 1  ·  YEAR 1–2</text><text x="92" y="462" font-size="25" font-weight="600" fill="#0b0b0b">Government</text><text x="92" y="496" font-size="15.5" fill="#52514e">State NHM · district health societies</text><text x="92" y="521" font-size="15.5" fill="#52514e">Setup fee + per-centre subscription</text><text x="92" y="546" font-size="15.5" fill="#52514e">Outcome-linked bonus · training</text><text x="92" y="581" font-size="15.5" font-weight="600" fill="#0b0b0b">Goal: prove impact at scale</text><g clip-path="url(#c1)"><path d="M456,288 Q456,280 464,280 H816 Q824,280 824,288 V610 H456 Z" fill="#eb6834" fill-opacity="0.10"/><rect x="456" y="280" width="368" height="5" fill="#eb6834"/></g><circle cx="489" cy="319" r="5" fill="#eb6834"/><text x="502" y="324" font-size="12.5" font-weight="600" letter-spacing="1" fill="#52514e">STAGE 2  ·  YEAR 2–3</text><text x="484" y="362" font-size="25" font-weight="600" fill="#0b0b0b">Private hospitals</text><text x="484" y="396" font-size="15.5" fill="#52514e">Hospitals · nursing homes · trusts</text><text x="484" y="421" font-size="15.5" fill="#52514e">Tiered SaaS + pay-per-use add-ons</text><text x="484" y="446" font-size="15.5" fill="#52514e">One-time onboarding fee</text><text x="484" y="481" font-size="15.5" font-weight="600" fill="#0b0b0b">Goal: recurring revenue</text><g clip-path="url(#c2)"><path d="M848,188 Q848,180 856,180 H1208 Q1216,180 1216,188 V610 H848 Z" fill="#1baf7a" fill-opacity="0.10"/><rect x="848" y="180" width="368" height="5" fill="#1baf7a"/></g><circle cx="881" cy="219" r="5" fill="#1baf7a"/><text x="894" y="224" font-size="12.5" font-weight="600" letter-spacing="1" fill="#52514e">STAGE 3  ·  YEAR 3+</text><text x="876" y="262" font-size="25" font-weight="600" fill="#0b0b0b">Hospital chains</text><text x="876" y="296" font-size="15.5" fill="#52514e">Multi-state hub-and-spoke networks</text><text x="876" y="321" font-size="15.5" fill="#52514e">Annual enterprise licence</text><text x="876" y="346" font-size="15.5" fill="#52514e">Integration · SLA · private cloud</text><text x="876" y="381" font-size="15.5" font-weight="600" fill="#0b0b0b">Goal: high-value contracts</text><path d="M392,372 C410,334 424,322 444,318" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="376" y="322" font-size="14" text-anchor="end" fill="#52514e">outcome data, case studies</text><text x="376" y="343" font-size="14" text-anchor="end" fill="#52514e">and credibility</text><path d="M784,272 C802,234 816,222 836,218" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="768" y="222" font-size="14" text-anchor="end" fill="#52514e">proven product</text><text x="768" y="243" font-size="14" text-anchor="end" fill="#52514e">and references</text><path d="M1032,616 V668 H248 V624" fill="none" stroke="#898781" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="372" y="655" width="536" height="26" fill="#fcfcfb"/><text x="640" y="673" font-size="14.5" text-anchor="middle" fill="#52514e">Revenue flows back: funds R&amp;D and keeps public healthcare affordable</text></svg>